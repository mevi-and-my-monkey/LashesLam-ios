name: LashesLam
options:
  bundleIdPrefix: com.mevi.lasheslam
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: "8.0.0"
  Lottie:
    url: https://github.com/airbnb/lottie-ios.git
    from: "4.4.0"

targets:
  LashesLam:
    type: application
    platform: iOS
    sources:
      - path: LashesLam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mevi.lasheslam.ios
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: LashesLam/Info.plist
        # Sign in with Apple (requiere cuenta de pago). Reactivar al pagar:
        # CODE_SIGN_ENTITLEMENTS: LashesLam/LashesLam.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseCrashlytics
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: Lottie
        product: Lottie
